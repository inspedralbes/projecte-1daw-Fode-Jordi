services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile_php
    ports:
      - "8082:80"
    volumes:
      - ./web:/var/www/html
    environment:
      VAR1: ${VAR1}
      VAR2: ${VAR2}
      MONGODB_URI: mongodb://usuari:12345@mongodb:27017
    depends_on:
      - db
      - mongodb

  db:
    image: mysql:9.3
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_USER: usuari
      MYSQL_PASSWORD: 12345
      MYSQL_DATABASE: persones
      LANG: C.UTF-8
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    ports:
      - "8083:8080"
    depends_on:
      - db

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: usuari
      MONGO_INITDB_ROOT_PASSWORD: 12345

  mongo-express:
    image: mongo-express
    ports:
      - "8084:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: usuari
      ME_CONFIG_MONGODB_ADMINPASSWORD: 12345
      ME_CONFIG_MONGODB_URL: mongodb://usuari:12345@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  db_data:
  mongodb_data:
